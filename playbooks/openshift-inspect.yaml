---
- name: Collect OpenShift Cluster Diagnostics
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    openshift_api_url: "https://api.sno.manohar.in:6443"
    openshift_token: "{{ lookup('env', 'OPENSHIFT_TOKEN') }}"
    validate_certs: false
    sos_report_dir: "/tmp/openshift-sos-reports"

  tasks:
    - name: Set report timestamp
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Set report directory
      ansible.builtin.set_fact:
        report_dir: "{{ sos_report_dir }}/inspect-{{ timestamp }}"

    - name: Verify OpenShift token
      ansible.builtin.assert:
        that:
          - openshift_token | length > 0
        fail_msg: "OPENSHIFT_TOKEN is not available."

    - name: Create report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Login to OpenShift
      ansible.builtin.command:
        argv:
          - oc
          - login
          - "--server={{ openshift_api_url }}"
          - "--token={{ openshift_token }}"
          - "--insecure-skip-tls-verify=true"
          - "--request-timeout=15s"
      no_log: true
      changed_when: false
      timeout: 30
      
    - name: Run OpenShift cluster must-gather
      ansible.builtin.command:
        argv:
          - oc
          - adm
          - must-gather
          - "--dest-dir={{ report_dir }}/cluster-must-gather"
      register: must_gather_result
      changed_when: true

    - name: Create compressed cluster diagnostic report
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ sos_report_dir }}/openshift-inspect-{{ timestamp }}.tar.gz"
          - -C
          - "{{ report_dir }}"
          - cluster-must-gather
      changed_when: true

    - name: Transfer cluster report to bastion
      ansible.builtin.expect:
        command: >-
          scp -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          {{ sos_report_dir }}/openshift-inspect-{{ timestamp }}.tar.gz
          root@192.168.0.201:/tmp/
        responses:
          '(?i)password:': "root"
        timeout: 600
      no_log: true
      changed_when: true

    - name: Display report location
      ansible.builtin.debug:
        msg:
          - "OpenShift cluster must-gather completed."
          - "Bastion: 192.168.0.201"
          - "Archive: /tmp/openshift-inspect-{{ timestamp }}.tar.gz"
