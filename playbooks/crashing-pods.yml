
---
- name: Find crashing pods across OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    failure_reasons:
      - CrashLoopBackOff
      - ErrImagePull
      - ImagePullBackOff
      - CreateContainerError
      - RunContainerError

  roles:
    - openshift_auth

  tasks:
    - name: Query pods across all namespaces
      block:
        - name: Call OpenShift pods API
          ansible.builtin.uri:
            url: "{{ openshift_api_server }}/api/v1/pods"
            method: GET
            headers:
              Authorization: "Bearer {{ openshift_api_token }}"
            validate_certs: false
            return_content: true
            status_code: 200
          register: pod_query
          no_log: true

      rescue:
        - name: Report OpenShift API request failure
          ansible.builtin.fail:
            msg: >-
              OpenShift API request failed. Check API connectivity,
              service-account token validity, and permissions to list pods.
              The underlying error is hidden to protect credentials.

    - name: Initialize crashing pod report
      ansible.builtin.set_fact:
        crashing_pods: []

    - name: Identify pods with failed containers
      ansible.builtin.set_fact:
        crashing_pods: "{{ crashing_pods + [pod_failure] }}"
      vars:
        container_statuses: >-
          {{
            (item.status.containerStatuses | default([], true))
            +
            (item.status.initContainerStatuses | default([], true))
          }}
        failed_containers: >-
          {{
            container_statuses
            | selectattr('state.terminated', 'defined')
            | selectattr('state.terminated.exitCode', 'defined')
            | rejectattr('state.terminated.exitCode', 'equalto', 0)
            | map(attribute='name')
            | list
          }}
        waiting_failures: >-
          {{
            container_statuses
            | selectattr('state.waiting', 'defined')
            | selectattr('state.waiting.reason', 'defined')
            | selectattr('state.waiting.reason', 'in', failure_reasons)
            | list
          }}
        pod_failure:
          namespace: "{{ item.metadata.namespace }}"
          pod: "{{ item.metadata.name }}"
          phase: "{{ item.status.phase | default('Unknown') }}"
          failed_containers: "{{ failed_containers }}"
          waiting_containers: "{{ waiting_failures | map(attribute='name') | list }}"
          waiting_reasons: "{{ waiting_failures | map(attribute='state.waiting.reason') | list }}"
      loop: "{{ pod_query.json['items'] | default([], true) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when: >-
        (failed_containers | length > 0)
        or (waiting_failures | length > 0)
        or (item.status.phase | default('') == 'Failed')

    - name: Display crashing pods
      ansible.builtin.debug:
        var: crashing_pods
      when: crashing_pods | length > 0

    - name: Report no crashing pods
      ansible.builtin.debug:
        msg: "No crashing pods found."
      when: crashing_pods | length == 0
