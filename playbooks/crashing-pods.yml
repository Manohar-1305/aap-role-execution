---
- name: Find crashing pods across OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "http://vault.vault.svc.cluster.local:8200"
    vault_role_id: "ed0ac1e5-1585-4206-853d-edfe999f242c"
    vault_secret_id: "dac494d2-f79e-4499-e189-3699be850d56"
    openshift_api_server: "https://api.sno.manohar.in:6443"

  tasks:
    - name: Authenticate to Vault using AppRole
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        return_content: true
        status_code: 200
      register: vault_login
      no_log: true

    - name: Read OpenShift API token from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/openshift/aap"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
        return_content: true
        status_code: 200
      register: vault_response
      no_log: true

    - name: Query pods across all namespaces
      ansible.builtin.uri:
        url: "{{ openshift_api_server }}/api/v1/pods"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_response.json.data.data['api-token'] }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: pod_query
      no_log: true

    - name: Initialize crashing pod report
      ansible.builtin.set_fact:
        crashing_pods: []


   
    - name: Process pods with container status lists
      ansible.builtin.set_fact:
        crashing_pods: "{{ crashing_pods + [pod_failure] }}"
      vars:
        container_statuses: "{{ item.status.containerStatuses | default([], true) }}"
        failed_containers: >-
          {{
            container_statuses
            | selectattr('state.terminated', 'defined')
            | selectattr('state.terminated.exitCode', 'defined')
            | selectattr('state.terminated.exitCode', 'ne', 0)
            | map(attribute='name')
            | list
          }}
        waiting_containers: >-
          {{
            container_statuses
            | selectattr('state.waiting', 'defined')
            | selectattr('state.waiting.reason', 'defined')
            | selectattr(
                'state.waiting.reason',
                'in',
                [
                  'CrashLoopBackOff',
                  'ErrImagePull',
                  'ImagePullBackOff',
                  'CreateContainerError',
                  'RunContainerError'
                ]
              )
            | map(attribute='name')
            | list
          }}
        pod_failure:
          namespace: "{{ item.metadata.namespace }}"
          pod: "{{ item.metadata.name }}"
          phase: "{{ item.status.phase | default('Unknown') }}"
          failed_containers: "{{ failed_containers }}"
          waiting_containers: "{{ waiting_containers }}"
      loop: "{{ pod_query.json['items'] | default([], true) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when: >-
        (item.status.phase | default('')) == 'Failed'
        or (failed_containers | length > 0)
        or (waiting_containers | length > 0)

    - name: Display crashing pod report
      ansible.builtin.debug:
        msg: "{{ crashing_pods if crashing_pods | length > 0 else ['No crashing containers found.'] }}"
