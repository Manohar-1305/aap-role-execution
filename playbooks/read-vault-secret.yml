---
- name: Read OpenShift credentials from Vault
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Retrieve credentials from Vault KV v2 using AppRole
      ansible.builtin.set_fact:
        vault_result: >-
          {{
            lookup(
              'community.hashi_vault.vault_kv2_get',
              'openshift/aap',
              engine_mount_point='secret',
              url='http://vault.vault.svc.cluster.local:8200',
              auth_method='approle',
              role_id=lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_ROLE_ID'),
              secret_id=lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_SECRET_ID'),
              validate_certs=false
            )
          }}
      no_log: true

    - name: Validate retrieved credentials
      ansible.builtin.assert:
        that:
          - vault_result.secret['api-token'] | length > 0
          - vault_result.secret['api-server'] | length > 0
        fail_msg: "Required OpenShift credentials are missing from Vault."
        success_msg: "OpenShift credentials retrieved successfully."
      no_log: true
