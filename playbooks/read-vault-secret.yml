
---
- name: Find crashing pods across OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "http://vault.vault.svc.cluster.local:8200"
    vault_role_id: "ed0ac1e5-1585-4206-853d-edfe999f242c"
    vault_secret_id: "dac494d2-f79e-4499-e189-3699be850d56"
    vault_path: "openshift/aap"

  tasks:
    - name: Authenticate to Vault and retrieve OpenShift credentials
      block:
        - name: Login to Vault using AppRole
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/auth/approle/login"
            method: POST
            body_format: json
            body:
              role_id: "{{ vault_role_id }}"
              secret_id: "{{ vault_secret_id }}"
            return_content: true
            status_code: 200
          register: vault_login
          no_log: true

        - name: Read OpenShift credentials from KV v2
          ansible.builtin.uri:
            url: "{{ vault_addr }}/v1/secret/data/{{ vault_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
            return_content: true
            status_code: 200
          register: vault_response
          no_log: true

        - name: Store OpenShift credentials in memory
          ansible.builtin.set_fact:
            openshift_api_token: "{{ vault_response.json.data.data['api-token'] }}"
            openshift_api_server: "{{ vault_response.json.data.data['api-server'] }}"
          no_log: true

        - name: Validate retrieved credentials
          ansible.builtin.assert:
            that:
              - openshift_api_token | length > 0
              - openshift_api_server | length > 0
            fail_msg: "Vault response did not contain the required OpenShift credentials."
          no_log: true

      rescue:
        - name: Report credential retrieval failure
          ansible.builtin.fail:
            msg: >-
              Vault credential retrieval failed. Check Vault connectivity,
              AppRole credentials, KV v2 path, and policy permissions.
              Secret values are withheld from job output.

    - name: Query OpenShift API for pods
      ansible.builtin.uri:
        url: "{{ openshift_api_server }}/api/v1/pods"
        method: GET
        headers:
          Authorization: "Bearer {{ openshift_api_token }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: pod_query
      changed_when: false
      failed_when: false

    - name: Stop if the OpenShift API request failed
      ansible.builtin.fail:
        msg: >-
          OpenShift API request failed.
          HTTP status: {{ pod_query.status | default('unavailable') }}.
          Error: {{ pod_query.msg | default('No additional error details') }}.
          Response: {{ pod_query.json.message | default('No API error message returned') if pod_query.json is defined else 'No JSON response returned' }}.
      when: pod_query.status | default(0) != 200

    - name: Initialize crashing pod report
      ansible.builtin.set_fact:
        crashing_pods: []

    - name: Identify containers in waiting failure states
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.waiting.reason
            }]
          }}
      loop: "{{ pod_query.json['items'] | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.waiting is defined
        - item.1.state.waiting.reason | default('') in [
            'CrashLoopBackOff',
            'ErrImagePull',
            'ImagePullBackOff',
            'CreateContainerError',
            'RunContainerError'
          ]

    - name: Identify containers terminated with errors
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.terminated.reason
            }]
          }}
      loop: "{{ pod_query.json['items'] | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.terminated is defined
        - item.1.state.terminated.reason | default('') in ['Error', 'OOMKilled']

    - name: Display crashing pod report
      ansible.builtin.debug:
        msg: "{{ crashing_pods if crashing_pods | length > 0 else ['No crashing containers found.'] }}"
