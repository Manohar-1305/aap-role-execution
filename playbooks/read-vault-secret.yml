---
- name: Read OpenShift credentials from Vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "http://vault.vault.svc.cluster.local:8200"
    vault_path: "openshift/aap"

  tasks:
    - name: Validate Vault AppRole credentials
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'VAULT_ROLE_ID') | length > 0
          - lookup('ansible.builtin.env', 'VAULT_SECRET_ID') | length > 0
        fail_msg: >-
          VAULT_ROLE_ID and VAULT_SECRET_ID must be configured
          as environment variables in the AAP job credential.

    - name: Retrieve credentials from Vault KV v2 using AppRole
      block:
        - name: Read OpenShift credentials
          ansible.builtin.set_fact:
            vault_result: >-
              {{
                lookup(
                  'community.hashi_vault.vault_kv2_get',
                  vault_path,
                  engine_mount_point='secret',
                  url=vault_addr,
                  auth_method='approle',
                  role_id=lookup('ansible.builtin.env', 'VAULT_ROLE_ID'),
                  secret_id=lookup('ansible.builtin.env', 'VAULT_SECRET_ID'),
                  validate_certs=false
                )
              }}
          no_log: true

        - name: Validate retrieved credentials
          ansible.builtin.assert:
            that:
              - vault_result.secret['api-token'] | length > 0
              - vault_result.secret['api-server'] | length > 0
            fail_msg: "Required OpenShift credentials are missing from Vault."
          no_log: true

        - name: Confirm Vault retrieval
          ansible.builtin.debug:
            msg: "OpenShift credentials retrieved successfully from Vault."

      rescue:
        - name: Report Vault retrieval failure
          ansible.builtin.fail:
            msg: >-
              Vault retrieval failed. Verify the AAP credential environment
              variables, Vault connectivity, AppRole configuration, and
              the vso-access policy.
