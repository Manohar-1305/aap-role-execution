---
- name: Read OpenShift credentials from Vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "http://vault.vault.svc.cluster.local:8200"
    vault_path: "openshift/aap"
    vault_role_id: "ed0ac1e5-1585-4206-853d-edfe999f242c"
    vault_secret_id: "dac494d2-f79e-4499-e189-3699be850d56"

  tasks:
    - name: Retrieve credentials from Vault KV v2 using AppRole
      block:
        - name: Read OpenShift credentials
          ansible.builtin.set_fact:
            vault_result: >-
              {{
                lookup(
                  'community.hashi_vault.vault_kv2_get',
                  vault_path,
                  engine_mount_point='secret',
                  url=vault_addr,
                  auth_method='approle',
                  role_id=vault_role_id,
                  secret_id=vault_secret_id,
                  validate_certs=false
                )
              }}
          no_log: true

        - name: Validate retrieved credentials
          ansible.builtin.assert:
            that:
              - vault_result.secret['api-token'] | length > 0
              - vault_result.secret['api-server'] | length > 0
            fail_msg: "Required OpenShift credentials are missing from Vault."
          no_log: true

        - name: Confirm Vault retrieval
          ansible.builtin.debug:
            msg: "OpenShift credentials retrieved successfully from Vault."

      rescue:
        - name: Report Vault retrieval failure
          ansible.builtin.fail:
            msg: >-
              Vault retrieval failed. Verify Vault connectivity, AppRole
              configuration, the Role ID and Secret ID, and the vso-access
              policy.
