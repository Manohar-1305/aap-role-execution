---
- name: Retrieve OpenShift credentials from Vault
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read OpenShift API credentials from Vault KV v2
      ansible.builtin.set_fact:
        openshift_vault_secret: >-
          {{
            lookup(
              'community.hashi_vault.vault_kv2_get',
              'openshift/aap',
              engine_mount_point='secret',
              url=lookup('ansible.builtin.env', 'VAULT_ADDR'),
              auth_method='approle',
              role_id=lookup('ansible.builtin.env', 'VAULT_ROLE_ID'),
              secret_id=lookup('ansible.builtin.env', 'VAULT_SECRET_ID'),
              validate_certs=false
            )
          }}
      no_log: true

    - name: Verify Vault secret retrieval
      ansible.builtin.assert:
        that:
          - openshift_vault_secret.secret['api-token'] | length > 0
          - openshift_vault_secret.secret['api-server'] | length > 0
        fail_msg: "Required OpenShift credentials were not retrieved from Vault."
        success_msg: "OpenShift credentials retrieved successfully."
      no_log: true
