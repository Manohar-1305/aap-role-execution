---
- name: Find crashing pods across OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "http://vault.vault.svc.cluster.local:8200"
    vault_path: "openshift/aap"
    vault_role_id: "ed0ac1e5-1585-4206-853d-edfe999f242c"
    vault_secret_id: "dac494d2-f79e-4499-e189-3699be850d56"

  tasks:
    - name: Authenticate to Vault using AppRole
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        return_content: true
        status_code: 200
      register: vault_login
      no_log: true

    - name: Read OpenShift API credentials from Vault KV v2
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/{{ vault_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
        return_content: true
        status_code: 200
      register: vault_response
      no_log: true

    - name: Query pods across the OpenShift cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        host: "{{ vault_response.json.data.data['api-server'] }}"
        api_key: "{{ vault_response.json.data.data['api-token'] }}"
        validate_certs: false
      register: pod_query
      no_log: true

    - name: Initialize crashing pod report
      ansible.builtin.set_fact:
        crashing_pods: []

    - name: Identify containers in waiting failure states
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.waiting.reason
            }]
          }}
      loop: "{{ pod_query.resources | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.waiting is defined
        - item.1.state.waiting.reason in [
            'CrashLoopBackOff',
            'ErrImagePull',
            'ImagePullBackOff',
            'CreateContainerError',
            'RunContainerError'
          ]

    - name: Identify containers terminated with errors
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.terminated.reason
            }]
          }}
      loop: "{{ pod_query.resources | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.terminated is defined
        - item.1.state.terminated.reason in ['Error', 'OOMKilled']

    - name: Display crashing pod report
      ansible.builtin.debug:
        msg: "{{ crashing_pods if crashing_pods | length > 0 else ['No crashing containers found.'] }}"
