---
- name: Find crashing pods across OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    openshift_api_server: "https://api.sno.manohar.in:6443"
    openshift_api_token: "{{ lookup('ansible.builtin.env', 'OPENSHIFT_API_TOKEN') }}"

  tasks:
    - name: Validate OpenShift API token
      ansible.builtin.assert:
        that:
          - openshift_api_token | length > 0
        fail_msg: "OPENSHIFT_API_TOKEN is missing from the AAP job environment."

    - name: Query OpenShift API for pods
      ansible.builtin.uri:
        url: "{{ openshift_api_server }}/api/v1/pods"
        method: GET
        headers:
          Authorization: "Bearer {{ openshift_api_token }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: pod_query
      no_log: false
      changed_when: false
      failed_when: false

    - name: Stop if the OpenShift API request failed
      ansible.builtin.fail:
        msg: >-
          OpenShift API request failed.
          HTTP status: {{ pod_query.status | default('unavailable') }}.
          Error: {{ pod_query.msg | default('No additional error details') }}.
          Response: {{ pod_query.json.message | default('No API error message returned') if pod_query.json is defined else 'No JSON response returned' }}.
      when: pod_query.status | default(0) != 200

    - name: Initialize crashing pod report
      ansible.builtin.set_fact:
        crashing_pods: []

    - name: Identify containers in waiting failure states
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.waiting.reason
            }]
          }}
      loop: "{{ pod_query.json.items | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.waiting is defined
        - item.1.state.waiting.reason in [
            'CrashLoopBackOff',
            'ErrImagePull',
            'ImagePullBackOff',
            'CreateContainerError',
            'RunContainerError'
          ]

    - name: Identify containers terminated with errors
      ansible.builtin.set_fact:
        crashing_pods: >-
          {{
            crashing_pods + [{
              'namespace': item.0.metadata.namespace,
              'pod': item.0.metadata.name,
              'container': item.1.name,
              'reason': item.1.state.terminated.reason
            }]
          }}
      loop: "{{ pod_query.json.items | subelements('status.containerStatuses', skip_missing=True) }}"
      when:
        - item.1.state.terminated is defined
        - item.1.state.terminated.reason in ['Error', 'OOMKilled']

    - name: Display crashing pod report
      ansible.builtin.debug:
        msg: "{{ crashing_pods if crashing_pods | length > 0 else ['No crashing containers found.'] }}"
