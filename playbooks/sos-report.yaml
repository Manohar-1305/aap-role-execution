---
- name: Generate OpenShift SOS Report using OpenShift REST API
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    openshift_api_url: "https://api.sno.manohar.in:6443"
    openshift_token: "{{ lookup('env', 'OPENSHIFT_TOKEN') }}"
    validate_certs: false

    sos_report_dir: "/tmp/openshift-sos-reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    report_dir: "{{ sos_report_dir }}/sos-report-{{ timestamp }}"

    api_headers:
      Authorization: "Bearer {{ openshift_token }}"
      Accept: "application/json"

  tasks:

    - name: Validate OpenShift API token
      ansible.builtin.assert:
        that:
          - openshift_token | length > 0
        fail_msg: "OPENSHIFT_TOKEN is missing. Configure it in the AAP credential."

    - name: Create SOS report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Collect OpenShift cluster information
      block:

        - name: Retrieve cluster version
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/clusterversions"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_version

        - name: Retrieve cluster operators
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/clusteroperators"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_operators

        - name: Retrieve nodes
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/nodes"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_nodes

        - name: Retrieve namespaces
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/namespaces"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: namespaces

        - name: Retrieve all pods
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/pods"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_pods

        - name: Retrieve cluster events
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/events"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_events

        - name: Retrieve persistent volumes
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/persistentvolumes"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: persistent_volumes

        - name: Retrieve persistent volume claims
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/persistentvolumeclaims"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: persistent_volume_claims

        - name: Retrieve storage classes
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/storage.k8s.io/v1/storageclasses"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: storage_classes

        - name: Retrieve machine config pools
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/machineconfiguration.openshift.io/v1/machineconfigpools"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: machine_config_pools

        - name: Retrieve machine configs
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/machineconfiguration.openshift.io/v1/machineconfigs"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: machine_configs

        - name: Retrieve routes
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/route.openshift.io/v1/routes"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_routes

        - name: Retrieve network configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/networks/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: network_config

        - name: Retrieve authentication configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/authentications/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: authentication_config

        - name: Retrieve image registry configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/imageregistry.operator.openshift.io/v1/configs/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: image_registry

        - name: Retrieve infrastructure configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/infrastructures/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: infrastructure_config

        - name: Retrieve cluster scheduler configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/schedulers/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: scheduler_config

        - name: Retrieve cluster proxy configuration
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/config.openshift.io/v1/proxies/cluster"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: proxy_config

        - name: Retrieve API services
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/apiregistration.k8s.io/v1/apiservices"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: api_services

        - name: Retrieve deployments
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/apps/v1/deployments"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: deployments

        - name: Retrieve daemonsets
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/apps/v1/daemonsets"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: daemonsets

        - name: Retrieve statefulsets
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/apps/v1/statefulsets"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: statefulsets

        - name: Retrieve jobs
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/batch/v1/jobs"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: jobs

        - name: Retrieve cronjobs
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/batch/v1/cronjobs"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cronjobs

        - name: Retrieve services
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/services"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: services

        - name: Retrieve endpoints
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/api/v1/endpoints"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: endpoints

        - name: Retrieve network policies
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/networking.k8s.io/v1/networkpolicies"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: network_policies

        - name: Retrieve security context constraints
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/security.openshift.io/v1/securitycontextconstraints"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: security_context_constraints

        - name: Retrieve cluster role bindings
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/rbac.authorization.k8s.io/v1/clusterrolebindings"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_role_bindings

        - name: Retrieve cluster roles
          ansible.builtin.uri:
            url: "{{ openshift_api_url }}/apis/rbac.authorization.k8s.io/v1/clusterroles"
            method: GET
            headers: "{{ api_headers }}"
            validate_certs: "{{ validate_certs }}"
            return_content: true
          register: cluster_roles

      rescue:
        - name: Report API collection failure
          ansible.builtin.fail:
            msg: "OpenShift API collection failed. Check API connectivity, token permissions and API availability."

    - name: Generate cluster summary
      ansible.builtin.copy:
        dest: "{{ report_dir }}/cluster-summary.txt"
        mode: "0640"
        content: |
          OPENSHIFT SOS REPORT
          ====================
          Cluster API: {{ openshift_api_url }}
          Generated: {{ timestamp }}

          CLUSTER VERSION
          ===============
          {% for version in cluster_version.json.items | default([]) %}
          Cluster: {{ version.metadata.name }}
          Version: {{ version.status.desired.version | default('Unknown') }}
          {% endfor %}

          CLUSTER OPERATORS
          =================
          {% for operator in cluster_operators.json.items | default([]) %}
          Operator: {{ operator.metadata.name }}
          {% for condition in operator.status.conditions | default([]) %}
          {{ condition.type }}: {{ condition.status }}
          Reason: {{ condition.reason | default('N/A') }}
          Message: {{ condition.message | default('N/A') }}
          {% endfor %}
          ----------------------------------------

          {% endfor %}
          NODES
          =====
          Total nodes: {{ cluster_nodes.json.items | default([]) | length }}
          {% for node in cluster_nodes.json.items | default([]) %}
          Node: {{ node.metadata.name }}
          Roles: {{ node.metadata.labels | default({}) | dict2items | selectattr('key', 'search', 'node-role.kubernetes.io') | map(attribute='key') | list }}
          {% for condition in node.status.conditions | default([]) %}
          {{ condition.type }}: {{ condition.status }}
          Reason: {{ condition.reason | default('N/A') }}
          {% endfor %}
          ----------------------------------------

          {% endfor %}
          POD SUMMARY
          ===========
          Total pods: {{ cluster_pods.json.items | default([]) | length }}
          {% for pod in cluster_pods.json.items | default([]) %}
          Namespace: {{ pod.metadata.namespace }}
          Pod: {{ pod.metadata.name }}
          Phase: {{ pod.status.phase | default('Unknown') }}
          Node: {{ pod.spec.nodeName | default('Unscheduled') }}
          ----------------------------------------

          {% endfor %}
          EVENTS
          ======
          Total events: {{ cluster_events.json.items | default([]) | length }}
          {% for event in cluster_events.json.items | default([]) %}
          Namespace: {{ event.metadata.namespace | default('Cluster') }}
          Type: {{ event.type | default('N/A') }}
          Reason: {{ event.reason | default('N/A') }}
          Object: {{ event.involvedObject.name | default('N/A') }}
          Message: {{ event.message | default('N/A') }}
          ----------------------------------------

          {% endfor %}
          RESOURCE COUNTS
          ===============
          Namespaces: {{ namespaces.json.items | default([]) | length }}
          Persistent Volumes: {{ persistent_volumes.json.items | default([]) | length }}
          Persistent Volume Claims: {{ persistent_volume_claims.json.items | default([]) | length }}
          Storage Classes: {{ storage_classes.json.items | default([]) | length }}
          Deployments: {{ deployments.json.items | default([]) | length }}
          DaemonSets: {{ daemonsets.json.items | default([]) | length }}
          StatefulSets: {{ statefulsets.json.items | default([]) | length }}
          Jobs: {{ jobs.json.items | default([]) | length }}
          CronJobs: {{ cronjobs.json.items | default([]) | length }}
          Services: {{ services.json.items | default([]) | length }}
          Routes: {{ cluster_routes.json.items | default([]) | length }}
    - name: Generate cluster summary
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        import os

        report_dir = "{{ report_dir }}"
        output = os.path.join(report_dir, "cluster-summary.txt")

        def load(name):
            path = os.path.join(report_dir, name + ".json")
            with open(path, encoding="utf-8") as f:
                return json.load(f)

        def items(name):
            data = load(name)
            return data.get("items", []) if isinstance(data, dict) else []

        lines = [
            "OPENSHIFT SOS REPORT",
            "====================",
            "Cluster API: {{ openshift_api_url }}",
            "Generated: {{ timestamp }}",
            "",
            "CLUSTER VERSION",
            "==============="
        ]

        for version in items("cluster-version"):
            lines.append("Cluster: " + str(version.get("metadata", {}).get("name", "N/A")))
            lines.append("Version: " + str(version.get("status", {}).get("desired", {}).get("version", "Unknown")))

        lines += ["", "CLUSTER OPERATORS", "================="]

        for operator in items("cluster-operators"):
            lines.append("Operator: " + str(operator.get("metadata", {}).get("name", "N/A")))
            for condition in operator.get("status", {}).get("conditions", []):
                lines.append(str(condition.get("type", "N/A")) + ": " + str(condition.get("status", "N/A")))
                lines.append("Reason: " + str(condition.get("reason", "N/A")))
                lines.append("Message: " + str(condition.get("message", "N/A")))
            lines.append("----------------------------------------")

        lines += ["", "NODES", "====="]
        nodes = items("nodes")
        lines.append("Total nodes: " + str(len(nodes)))

        for node in nodes:
            metadata = node.get("metadata", {})
            lines.append("Node: " + str(metadata.get("name", "N/A")))
            labels = metadata.get("labels", {})
            roles = [key for key in labels if key.startswith("node-role.kubernetes.io/")]
            lines.append("Roles: " + ", ".join(roles))
            for condition in node.get("status", {}).get("conditions", []):
                lines.append(str(condition.get("type", "N/A")) + ": " + str(condition.get("status", "N/A")))
                lines.append("Reason: " + str(condition.get("reason", "N/A")))
            lines.append("----------------------------------------")

        lines += ["", "POD SUMMARY", "==========="]
        pods = items("pods")
        lines.append("Total pods: " + str(len(pods)))

        for pod in pods:
            metadata = pod.get("metadata", {})
            spec = pod.get("spec", {})
            status = pod.get("status", {})
            lines.append("Namespace: " + str(metadata.get("namespace", "N/A")))
            lines.append("Pod: " + str(metadata.get("name", "N/A")))
            lines.append("Phase: " + str(status.get("phase", "Unknown")))
            lines.append("Node: " + str(spec.get("nodeName", "Unscheduled")))
            lines.append("----------------------------------------")

        lines += ["", "EVENTS", "======"]
        events = items("events")
        lines.append("Total events: " + str(len(events)))

        for event in events:
            metadata = event.get("metadata", {})
            involved = event.get("involvedObject", {})
            lines.append("Namespace: " + str(metadata.get("namespace", "Cluster")))
            lines.append("Type: " + str(event.get("type", "N/A")))
            lines.append("Reason: " + str(event.get("reason", "N/A")))
            lines.append("Object: " + str(involved.get("name", "N/A")))
            lines.append("Message: " + str(event.get("message", "N/A")))
            lines.append("----------------------------------------")

        resource_files = {
            "Namespaces": "namespaces",
            "Persistent Volumes": "persistent-volumes",
            "Persistent Volume Claims": "persistent-volume-claims",
            "Storage Classes": "storage-classes",
            "Deployments": "deployments",
            "DaemonSets": "daemonsets",
            "StatefulSets": "statefulsets",
            "Jobs": "jobs",
            "CronJobs": "cronjobs",
            "Services": "services",
            "Routes": "routes"
        }

        lines += ["", "RESOURCE COUNTS", "==============="]

        for label, filename in resource_files.items():
            lines.append(label + ": " + str(len(items(filename))))

        with open(output, "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")
        PY
      args:
        executable: /bin/bash
      changed_when: true

    - name: Display generated SOS report
      ansible.builtin.debug:
        msg:
          - "OpenShift SOS report generated successfully."
          - "Report directory: {{ report_dir }}"
          - "Compressed report: {{ sos_report_dir }}/openshift-sos-report-{{ timestamp }}.tar.gz"
